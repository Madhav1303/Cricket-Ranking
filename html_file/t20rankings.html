<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>T20 Player Rankings</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f2f5fa;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: #ffffff;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        thead {
            background-color: #1d4ed8;
            color: white;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        tbody tr:hover {
            background-color: #f1f5f9;
        }

        .rank-badge {
            font-weight: bold;
            color: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>T20 Player Rankings (by Runs)</h1>
    <a class="back-link" href="{% url 'players_list' %}">← Back to Player List</a>

    <table>
        <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>DOB</th>
                <th>Team</th>
                <th>Role</th>
                <th>Runs</th>
            </tr>
        </thead>
        <tbody>
            {% for player in players %}
            <tr>
                <td class="rank-badge">{{ forloop.counter }}</td>
                <td>{{ player.name }}</td>
                <td>{{player.dob}}</td>
                <td>{{ player.nationality }}</td>
                <td>{{ player.role }}</td>
                <td>{{ player.totalruns_t20_matches }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="6" style="text-align: center;">No players found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
